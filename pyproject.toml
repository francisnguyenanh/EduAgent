[project]
name = "eduagent"
version = "0.1.0"
description = "Collaborative Partner Socratic mentor — All Things Agentic Hackathon"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "e2e: hits real Vertex AI / Firestore / GCP services -- slow, needs live credentials. Skip with `-m \"not e2e\"` during fast local iteration.",
]
